name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # @microsoft/winappcli only installs on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      # Also generates the auto-import declarations the type check needs.
      - name: Build frontend
        run: pnpm exec vite build

      - run: pnpm typecheck

      - run: pnpm test
