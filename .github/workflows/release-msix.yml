name: Build Microsoft Store package

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: 'MSIX version (four components, last component 0)'
        required: true
        default: '1.0.0.0'
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Build unsigned Store package
        shell: pwsh
        env:
          STORE_PACKAGE_VERSION: ${{ inputs.package_version }}
        run: ./scripts/package-msix.ps1 -PackageVersion $env:STORE_PACKAGE_VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: WTFSync-msix-x64
          path: |
            artifacts/msix/**/*.msix
            artifacts/msix/**/*.msix.json
          if-no-files-found: error
