[package]
name = "wtfsync"
version = "0.1.0"
edition = "2024"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wtfsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = { version = "2.7.1", features = ["watch"] }
tauri-plugin-opener = "2.7.3"
tauri-plugin-prevent-default = { version = "6.0.1", features = ["platform-windows"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-store = "2.5.1"
tauri-plugin-window-state = "2.5.0"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.18.0", default-features = false, features = ["common-controls-v6"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
